<div class="row">
  <div class="col-12">
    <mat-card class="main">
      <mat-card-header>
        <mat-card-title class="section-title">Temporizador</mat-card-title>
      </mat-card-header>

      <mat-card-content class="container-fluid px-0">
        <p class="section-subtitle">Define la duración y controla tu sesión con pausas rápidas.</p>

        <div class="row">
          <div class="col-xl-3 col-lg-4">
            <section class="control-block" aria-label="Ajustes de tiempo">
              <div id="setTime">
                <h5>{{ time.seconds }} segundos</h5>
                <mat-slider
                  [disabled]="disabled"
                  [invert]="invert"
                  [max]="max"
                  [min]="min"
                  [step]="step"
                  [thumbLabel]="thumbLabel"
                  [tickInterval]="getSliderTickInterval()"
                  [(ngModel)]="time.seconds"
                  [vertical]="vertical">
                </mat-slider>
              </div>

              <div id="setTime">
                <h5>{{ time.minutes }} minutos</h5>
                <mat-slider
                  [disabled]="disabled"
                  [invert]="invert"
                  [max]="max"
                  [min]="min"
                  [step]="step"
                  [thumbLabel]="thumbLabel"
                  [tickInterval]="getSliderTickInterval()"
                  [(ngModel)]="time.minutes"
                  [vertical]="vertical">
                </mat-slider>
              </div>

              <div id="setTime">
                <h5>{{ time.hours }} horas</h5>
                <mat-slider
                  [disabled]="disabled"
                  [invert]="invert"
                  [max]="maxHours"
                  [min]="min"
                  [step]="step"
                  [thumbLabel]="thumbLabel"
                  [tickInterval]="getSliderTickInterval()"
                  [(ngModel)]="time.hours"
                  [vertical]="vertical">
                </mat-slider>
              </div>
            </section>
          </div>

          <div class="col-xl-9 col-lg-8 d-flex align-items-center">
            <div class="timer-display w-100" aria-live="polite">
              <span *ngIf="time.hours != 0">{{ display.hours }}:</span>
              <span>{{ display.minutes }}:</span>
              <span>{{ display.seconds }}</span>
            </div>
          </div>
        </div>

        <h4 class="finish-time" *ngIf="dFinish">Finaliza a las {{ dFinish }}</h4>
      </mat-card-content>

      <mat-card-actions class="action-row">
        <button
          mat-raised-button
          color="primary"
          [disabled]="clickedPlay"
          (click)="start(); clickedPlay = true; clickedPause = false;">
          {{ buttonPlay }}
        </button>

        <button
          mat-raised-button
          color="accent"
          [disabled]="clickedPause"
          (click)="pause(); clickedPlay = false; clickedPause = true;">
          Pausar
        </button>

        <button
          mat-raised-button
          color="warn"
          (click)="reset(); clickedPlay = false; clickedPause = true;">
          Restablecer
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
