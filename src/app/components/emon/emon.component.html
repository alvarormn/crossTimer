<div class="row">
  <div class="col-lg-4">
    <mat-card class="main">
      <mat-card-header>
        <mat-card-title class="section-title">Configuración</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="section-subtitle">Elige cuántas rondas quieres completar.</p>
        <form [formGroup]="checkoutForm">
          <mat-form-field class="example-full-width">
            <mat-label>Rondas</mat-label>
            <input matInput formControlName="reps" type="number" min="0">
          </mat-form-field>
        </form>
      </mat-card-content>
      <mat-card-actions class="action-row">
        <button mat-raised-button color="primary" (click)="apply()">Aplicar</button>
        <button mat-raised-button color="warn">Resetear</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div class="col-lg-8">
    <mat-card class="main">
      <mat-card-header>
        <mat-card-title class="section-title">{{ title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="timer-display">{{ display.minutes }}:{{ display.seconds }}</div>

        <div id="TableReps" class="table-responsive">
          <table *ngIf="reps" class="table table-striped">
            <tbody>
              <tr>
                <td
                  *ngFor="let col of reps; index as i"
                  [ngClass]="{
                    'tdWait': i > index,
                    'tdRun': i == index,
                    'tdDone': i < index
                  }"
                  class="round">
                  Ronda {{ i + 1 }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </mat-card-content>
      <mat-card-actions class="action-row">
        <button mat-raised-button color="primary" (click)="start();">Iniciar</button>
        <button mat-raised-button color="accent">Pausa</button>
        <button mat-raised-button color="warn">Reinicio</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
